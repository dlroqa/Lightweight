[workspace]
resolver = "3"
members = [
    "crates/hermes-core",
    "crates/hermes-gguf",
    "crates/hermes-memory",
    "crates/hermes-inference",
    "crates/hermes-download",
    "crates/hermes-catalog",
    "crates/hermes-bench",
    "crates/hermes-store",
    "crates/hermes-backend-llamacpp",
    "crates/hermes-backend-mock",
    "crates/hermes-api",
    "crates/hermes-gateway",
    "crates/hermes-cli",
    "crates/hermes-system-info",
    "crates/hermes-observability",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/hermes/cpu-inference-gateway"

# ---------------------------------------------------------------------------
# DEPENDENCY POLICY - enforced, not advisory.
#
# This project must build on a machine with NO sudo, NO cmake, NO libssl-dev
# and NO libclang. Violating any rule below makes the workspace unbuildable
# there. `scripts/check-deps.sh` gates this in CI.
#
#   1. NO cmake.      rustls 0.23 defaults its crypto provider to `aws-lc-rs`,
#                     whose build script REQUIRES cmake. We pin `ring` instead.
#                     No `-sys` crate may shell out to cmake.
#   2. NO OpenSSL.    `libssl-dev` is absent => `native-tls` / `openssl-sys`
#                     are banned. rustls end to end.
#   3. NO libclang.   => no `bindgen`, and therefore no llama.cpp FFI. The
#                     inference engine is a supervised child process instead.
#   4. Compile budget. Banned: polars, tonic, sqlx. Use rusqlite (bundled),
#                     which builds with `cc` alone.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# --- core, no I/O ---
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smallvec = { version = "1.15.2", features = ["serde", "union"] }

# --- observability ---
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt", "time"] }
tracing-appender = "0.2.5"

# --- platform ---
directories = "6.0.0"
# `statvfs` without `unsafe` in our crates: the syscall is wrapped safely
# upstream, so `forbid(unsafe_code)` survives everywhere. It does have a build
# script, but that script only re-invokes `rustc` to probe for cfgs and declares
# no build-dependencies of its own - no cc, no cmake, no libclang. On Linux the
# `linux_raw` backend issues syscalls directly, so libc is not pulled in either.
rustix = { version = "1.1.4", default-features = false, features = ["fs", "std"] }

# --- command line ---
clap = { version = "4.6.6", features = ["derive"] }

# --- async runtime and process supervision ---
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "net", "time", "io-util", "sync", "signal", "fs"] }
tokio-util = "0.7.19"
async-trait = "0.1.92"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }

# --- HTTP ---
# `rustls-no-provider` is deliberate: the default `rustls` feature selects
# aws-lc-rs, whose build requires cmake. We install the `ring` provider
# ourselves instead. See the dependency policy above.
# `axum` 0.8 brings hyper and tower; no build scripts, no cmake, no OpenSSL.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query", "matched-path", "original-uri", "tracing"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "http2", "charset", "json", "stream"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# --- bytes ---
# Already in the tree via reqwest/hyper; named explicitly because the upstream
# SSE translator has to spell out the stream's item type.
bytes = "1.12.1"

# --- archives and digests ---
sha2 = "0.11.0"
hex = "0.4.3"
tar = "0.4.46"
flate2 = "1.1.9"          # defaults to the pure-Rust miniz_oxide backend
zip = "8.6.0"

# --- platform ---
libc = "0.2.189"
getrandom = "0.4.3"   # OS entropy for the per-run engine API key

# --- internal ---
hermes-core = { path = "crates/hermes-core" }
hermes-gguf = { path = "crates/hermes-gguf" }
hermes-memory = { path = "crates/hermes-memory" }
hermes-inference = { path = "crates/hermes-inference" }
hermes-download = { path = "crates/hermes-download" }
hermes-catalog = { path = "crates/hermes-catalog" }
hermes-bench = { path = "crates/hermes-bench" }
hermes-store = { path = "crates/hermes-store" }
hermes-backend-llamacpp = { path = "crates/hermes-backend-llamacpp" }
hermes-backend-mock = { path = "crates/hermes-backend-mock" }
hermes-api = { path = "crates/hermes-api" }
hermes-gateway = { path = "crates/hermes-gateway" }
hermes-system-info = { path = "crates/hermes-system-info" }
hermes-observability = { path = "crates/hermes-observability" }

# ---------------------------------------------------------------------------
# Build profiles tuned for a 4-core 1.5 GHz CPU with ~2.3 GB free RAM.
# Dependencies get opt-level 1 (built once, then cached, and fast at runtime);
# our own crates stay at opt-level 0 so edit-compile cycles stay short.
# ---------------------------------------------------------------------------
[profile.dev]
debug = "line-tables-only"
codegen-units = 256
incremental = true

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
panic = "abort"
