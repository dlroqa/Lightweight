[workspace]
resolver = "3"
members = [
    "crates/lightweight-core",
    "crates/lightweight-gguf",
    "crates/lightweight-memory",
    "crates/lightweight-inference",
    "crates/lightweight-download",
    "crates/lightweight-catalog",
    "crates/lightweight-bench",
    "crates/lightweight-store",
    "crates/lightweight-backend-llamacpp",
    "crates/lightweight-backend-mock",
    "crates/lightweight-api",
    "crates/lightweight-gateway",
    "crates/lightweight-cli",
    "crates/lightweight-system-info",
    "crates/lightweight-observability",
    "crates/lightweight-sys",
    "crates/lightagent-core",
    "crates/lightagent-provider-lightweight",
    "crates/lightagent-tools",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/dlroqa/Lightweight"

# ---------------------------------------------------------------------------
# DEPENDENCY POLICY - enforced, not advisory.
#
# This project must build on a machine with NO sudo, NO cmake, NO libssl-dev
# and NO libclang. Violating any rule below makes the workspace unbuildable
# there. `scripts/check-deps.sh` gates this in CI.
#
#   1. NO cmake.      rustls 0.23 defaults its crypto provider to `aws-lc-rs`,
#                     whose build script REQUIRES cmake. We pin `ring` instead.
#                     No `-sys` crate may shell out to cmake.
#   2. NO OpenSSL.    `libssl-dev` is absent => `native-tls` / `openssl-sys`
#                     are banned. rustls end to end.
#   3. NO libclang.   => no `bindgen`, and therefore no llama.cpp FFI. The
#                     inference engine is a supervised child process instead.
#   4. Compile budget. Banned: polars, tonic, sqlx. Use rusqlite (bundled),
#                     which builds with `cc` alone.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# --- core, no I/O ---
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smallvec = { version = "1.15.2", features = ["serde", "union"] }

# --- observability ---
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt", "time"] }
tracing-appender = "0.2.5"

# --- platform ---
directories = "6.0.0"
# `statvfs` without `unsafe` in our crates: the syscall is wrapped safely
# upstream, so `forbid(unsafe_code)` survives everywhere. It does have a build
# script, but that script only re-invokes `rustc` to probe for cfgs and declares
# no build-dependencies of its own - no cc, no cmake, no libclang. On Linux the
# `linux_raw` backend issues syscalls directly, so libc is not pulled in either.
rustix = { version = "1.1.4", default-features = false, features = ["fs", "std"] }

# --- command line ---
clap = { version = "4.6.6", features = ["derive"] }

# --- async runtime and process supervision ---
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "net", "time", "io-util", "sync", "signal", "fs"] }
tokio-util = "0.7.19"
async-trait = "0.1.92"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }

# --- HTTP ---
# `rustls-no-provider` is deliberate: the default `rustls` feature selects
# aws-lc-rs, whose build requires cmake. We install the `ring` provider
# ourselves instead. See the dependency policy above.
# `axum` 0.8 brings hyper and tower; no build scripts, no cmake, no OpenSSL.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query", "matched-path", "original-uri", "tracing"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "http2", "charset", "json", "stream"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# --- bytes ---
# Already in the tree via reqwest/hyper; named explicitly because the upstream
# SSE translator has to spell out the stream's item type.
bytes = "1.12.1"

# --- archives and digests ---
sha2 = "0.11.0"
hex = "0.4.3"
tar = "0.4.46"
flate2 = "1.1.9"          # defaults to the pure-Rust miniz_oxide backend
zip = "8.6.0"

# --- platform ---
libc = "0.2.189"
# Windows' own numbers - physical memory, processor topology, free disk space,
# adapter addresses - are published only through C APIs. `windows-sys` is
# declarations and nothing else: no build script, no cmake, no libclang, no
# proc macros, so the dependency policy above is satisfied unchanged. It is
# already in `Cargo.lock` (tokio, mio, socket2, rustix and getrandom all pull
# it on Windows), so naming it here adds feature modules rather than a crate.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_IpHelper",
    # `GetAdaptersAddresses` is gated on both of these upstream, not just on
    # IpHelper - checked in windows-sys-0.61.2's own source rather than guessed.
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }
getrandom = "0.4.3"   # OS entropy for the per-run engine API key

# --- internal ---
lightweight-core = { path = "crates/lightweight-core" }
lightweight-gguf = { path = "crates/lightweight-gguf" }
lightweight-memory = { path = "crates/lightweight-memory" }
lightweight-inference = { path = "crates/lightweight-inference" }
lightweight-download = { path = "crates/lightweight-download" }
lightweight-catalog = { path = "crates/lightweight-catalog" }
lightweight-bench = { path = "crates/lightweight-bench" }
lightweight-store = { path = "crates/lightweight-store" }
lightweight-backend-llamacpp = { path = "crates/lightweight-backend-llamacpp" }
lightweight-backend-mock = { path = "crates/lightweight-backend-mock" }
lightweight-api = { path = "crates/lightweight-api" }
lightweight-gateway = { path = "crates/lightweight-gateway" }
lightweight-system-info = { path = "crates/lightweight-system-info" }
lightweight-observability = { path = "crates/lightweight-observability" }
lightweight-sys = { path = "crates/lightweight-sys" }

# --- lightagent (agent harness; strictly additive, no edge into lightweight-*) ---
lightagent-core = { path = "crates/lightagent-core" }
lightagent-provider-lightweight = { path = "crates/lightagent-provider-lightweight" }
lightagent-tools = { path = "crates/lightagent-tools" }

# ---------------------------------------------------------------------------
# Build profiles tuned for a 4-core 1.5 GHz CPU with ~2.3 GB free RAM.
# Dependencies get opt-level 1 (built once, then cached, and fast at runtime);
# our own crates stay at opt-level 0 so edit-compile cycles stay short.
# ---------------------------------------------------------------------------
[profile.dev]
debug = "line-tables-only"
codegen-units = 256
incremental = true

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
panic = "abort"
