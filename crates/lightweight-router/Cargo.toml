[package]
name = "lightweight-router"
description = "A federated model router: stable logical model names over remote Lightweight gateways."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The router is a client of Lightweight gateways, never an inference engine: it
# depends on the gateway only for its authentication policy and on the API
# crate only for the wire types both sides already agree on (and on the
# engine-neutral request those types convert into, to read what a request needs
# exactly as the gateway does). Nothing here
# parses GGUF, estimates memory, loads a model or supervises an engine.
[dependencies]
lightweight-core.workspace = true
lightweight-api.workspace = true
lightweight-inference.workspace = true
lightweight-catalog.workspace = true
lightweight-gateway.workspace = true
lightweight-download.workspace = true
lightweight-observability.workspace = true
axum.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
getrandom.workspace = true
indexmap.workspace = true
sha2.workspace = true
keyring-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store.workspace = true

[dev-dependencies]
lightweight-backend-mock.workspace = true
rustls.workspace = true
# To read the log lines a request leaves on the router and on a real node, and
# prove they carry one request id and no prompt.
tracing-subscriber.workspace = true
# For placement tests against real gateways that hold an installed, unloaded
# model: a fixture GGUF, a catalog, and a machine of a chosen size.
lightweight-gguf = { workspace = true, features = ["fixtures"] }
lightweight-system-info.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
