[package]
name = "hermes-system-info"
description = "Platform data directories, CPU topology and memory probing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
hermes-core.workspace = true
thiserror.workspace = true
serde.workspace = true
directories.workspace = true
rustix.workspace = true

# Only macOS and Windows need it: on Linux every number here comes from /proc or
# from `rustix`, so a Linux build pulls in nothing new and this crate's
# `forbid(unsafe_code)` costs nothing to keep.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
hermes-sys.workspace = true

[dev-dependencies]
serde_json.workspace = true
