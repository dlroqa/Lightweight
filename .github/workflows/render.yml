# Render the panel end to end and prove the control-panel screens work.
#
# The unit and integration gate is `check.yml`, which runs `cargo test
# --workspace`. This workflow is the tier above that: it boots the real server
# the product runs — the inference gateway (`lightweight serve --web-root`) —
# loads the built panel in a real headless browser, and asserts every
# control-panel screen renders its data instead of the `<!doctype …>` SPA
# fallback. It lives in its own workflow, not as a copy of the test gate, so
# the two never drift; the orchestration is in `scripts/render-panel.sh` so it
# is identical locally and here.
#
# Every screen is screenshotted and uploaded — on failure too — so a human can
# eyeball the panel on a pull request the way the `icons` job lets them eyeball
# the icons.
name: render panel

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Incremental artifacts are valuable during an edit/compile loop, but not in a
# one-shot CI process. Omitting them keeps the hosted runner and Rust cache
# smaller while dependency and final build artifacts remain cached.
env:
  CARGO_INCREMENTAL: '0'

jobs:
  render:
    name: render panel
    # Linux only: the panel is platform-independent, and a browser render on one
    # runner proves the seam between the gateway and the panel on all of them.
    # The check gate already runs on every platform.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # As in check.yml: the toolchain is pinned in rust-toolchain.toml and
      # `rustup show` installs it, so there is no second copy of the pin here.
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: render-panel

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      # The panel is built by the render script if `frontend/dist` is absent;
      # its deps are installed here so that build has what it needs. The e2e
      # package carries only Playwright.
      - run: npm ci --prefix frontend
      - run: npm ci --prefix e2e

      # `--with-deps` installs the system libraries headless Chromium needs on a
      # fresh runner; the browser itself is pinned by the Playwright version in
      # e2e/package.json. No xvfb: headless shell needs no display.
      - name: Install the render browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # The whole thing: build the gateway, start it wired as the product wires
      # it, then render and check every control-panel screen.
      - name: Render and check the panel
        run: bash ./scripts/render-panel.sh

      # Always, so a failed render still uploads the screenshot of the screen
      # that broke — the fastest way to see what a red run is complaining about.
      - name: Upload the rendered screens
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: panel-screens
          path: e2e/screens/
          if-no-files-found: error
          retention-days: 14

  # The desktop app with a Router beside its Gateway: the real Electron app,
  # headless, opening Router & Jev Settings in the Router's own window. One
  # Linux job, not a matrix: what it proves is the seam between the shell, its
  # two supervisors and the two origins, which is the same on every platform;
  # the shell's own tests already run on all four in check.yml. Jev and the
  # Router's nodes are scripted, so no key and no external service is needed.
  desktop:
    name: desktop with router
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: render-desktop

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            apps/desktop/package-lock.json
            e2e/package-lock.json

      - run: npm ci --prefix frontend
      - run: npm ci --prefix apps/desktop
      - run: npm ci --prefix e2e

      # As check.yml's AppImage launch: `ubuntu-latest` restricts unprivileged
      # user namespaces, which Chromium's sandbox needs, and the app refuses to
      # run without its sandbox rather than quietly losing it. Lifting the knob
      # is the configuration the app is for. `|| true` because the knob does not
      # exist on every image, and its absence is the permissive case. `xvfb`
      # because the app opens real windows.
      - name: Render the desktop app with a Router
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          xvfb-run --auto-servernum bash ./scripts/render-desktop.sh

      # Always: a failed run's screenshots and the app's own (redacted) log are
      # the fastest way to see what it is complaining about.
      - name: Upload the desktop screens and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-screens
          path: e2e/desktop-screens/
          if-no-files-found: error
          retention-days: 14
