# The gate, run on every platform the product ships to.
#
# It runs `scripts/check.sh` and does not reimplement it. That script is the
# contributor contract and says so at the top of itself; a YAML copy of it
# would be a second place for the two to disagree, and the one that runs in CI
# would win silently.
#
# What each runner skips it announces, because `check.sh` announces every
# skipped tier rather than passing quietly. That is what makes partial coverage
# on a platform readable in the log instead of invisible behind a green tick.
name: check

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      # A Windows failure must not hide a macOS one. Every runner reports.
      fail-fast: false
      matrix:
        include:
          # One runner per architecture: a test proves something only on the
          # architecture it ran on, and the macOS DMG ships both.
          - { os: macos-15, label: macos-arm64, arch: arm64 }
          # Intel macOS proves the x86-64 half of the universal DMG actually
          # runs rather than merely having been built. `macos-15-intel` and not
          # `macos-15-large`: both are Intel and both appear in
          # actions/runner-images, but the `-large` one is a *larger runner* and
          # bills for it. On this repository it stopped starting at all - "the
          # job was not started because recent account payments have failed or
          # your spending limit needs to be increased" - which is a billing
          # setting standing between the product and the only x86-64 macOS
          # check it has.
          - { os: macos-15-intel, label: macos-x64, arch: x64 }
          - { os: windows-latest, label: windows-x64, arch: x64 }
          - { os: ubuntu-latest, label: linux-x64, arch: x64 }

    defaults:
      run:
        # Git Bash on Windows. This plus `.gitattributes` checking scripts out
        # with LF is the whole answer to "how does a bash gate run on Windows".
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # No toolchain action: `rust-toolchain.toml` already pins the compiler and
      # its components, and `rustup show` installs what it names. Restating the
      # pin in YAML would create a second place for the two to disagree.
      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            apps/desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci --prefix frontend
      - run: npm ci --prefix apps/desktop

      # Invoked through `bash` rather than executed, so the answer does not also
      # depend on the executable bit surviving a Windows checkout.
      - name: scripts/check.sh
        run: bash ./scripts/check.sh

      # The probes, read rather than asserted. A checkpoint that quotes four
      # real machines is worth more than one that quotes four assertions, and
      # this is where those numbers come from.
      - name: What this machine reports
        run: cargo run -q -p lightweight-cli --bin hermes -- sysinfo

  linux-artifacts:
    name: linux artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            apps/desktop/package-lock.json

      - run: npm ci --prefix frontend
      - run: npm ci --prefix apps/desktop

      # The artifact tests need a real release binary and a real built panel:
      # `extraResources` copies both into the package, and a stale one has
      # shipped before (PROGRESS.md:919-922).
      #
      # `--target` deliberately, because `release.yml` builds that way and this
      # job did not: the binary then lands under `target/<triple>/release`, and
      # staging it from `target/release` alone was green here every time while
      # failing in the release. The `flatpak` job below builds without a triple,
      # so the two jobs exercise one resolution branch each.
      - run: cargo build --release -p lightweight-cli --target x86_64-unknown-linux-gnu
      - run: npm run build --prefix frontend

      - name: Package the AppImage
        run: npm --prefix apps/desktop run package -- --linux AppImage

      # This is where the *supported* case is exercised: the app started, and no
      # live process of it carrying `--no-sandbox`. That claim used to be made
      # here and was not true. `ubuntu-latest` is 24.04, which ships
      # `kernel.apparmor_restrict_unprivileged_userns=1` - the same restriction
      # as the development machine - so `unshare -Ur` failed, the launch skipped,
      # and the job went green having asserted nothing about it. Lifting the
      # knob puts the runner in the configuration the AppImage is *for*; the
      # restricted configuration is already covered by the refusal check above,
      # which is why both belong in one run. `|| true` because the knob does not
      # exist on every image, and its absence is the permissive case.
      #
      # `xvfb` because that launch opens a real window.
      - name: Artifact checks
        env:
          # Demanded, not hoped for: with the knob lifted above there is no
          # reason for the launch to skip, and a skip that stays green is what
          # hid this in the first place.
          HERMES_REQUIRE_SANDBOXED_LAUNCH: '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          xvfb-run --auto-servernum ./scripts/test-artifacts.sh

  # The Flatpak build, which is the primary public Linux artifact.
  #
  # Separate from the job above because it needs packages installed with sudo,
  # which is exactly why it has never been built on the development machine.
  flatpak:
    name: flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: flatpak
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm ci --prefix apps/desktop

      - name: Install flatpak and the runtimes the manifest names
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.electronjs.Electron2.BaseApp//24.08

      - run: cargo build --release -p lightweight-cli
      - run: npm run build --prefix frontend
      - run: npm --prefix apps/desktop run package -- --linux flatpak

      # `scripts/test-flatpak.sh` installs the bundle and asserts against the
      # installed application rather than against the configuration that built
      # it - including the two things the manifest cannot show: the rewritten
      # application id, and whether the app data directory will execute the
      # engine it downloads. `xvfb` because the launch check opens a window.
      - name: Artifact checks
        run: |
          sudo apt-get install -y xvfb dbus-x11
          xvfb-run --auto-servernum ./scripts/test-flatpak.sh

      - name: What was installed
        if: always()
        run: flatpak list --user --app
