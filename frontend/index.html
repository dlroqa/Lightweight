<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hermes — CPU Inference Gateway</title>

    <!--
      Icons, from `public/`, which Vite copies to the web root verbatim.

      Fixed paths on purpose: the bundler content-hashes everything it emits,
      but a browser asks for `/favicon.ico` by reflex and a home screen asks for
      `/apple-touch-icon.png`, and neither reads this document first. All three
      are cut from `icon/source.png` by `scripts/build-icons.py`.
    -->
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#131c23" />
    <!--
      No web font is fetched.

      This gateway is built for machines that may have no outbound network at
      all - the dependency policy in the workspace manifest exists for exactly
      that reason - and a panel whose type does not arrive until a font server
      answers is a panel that renders wrongly on the machine it was made for.
      The stack below prefers Inter where it is installed and falls back to the
      platform's own UI face everywhere else.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
